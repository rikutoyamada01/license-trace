[package]
name = "license-trace"
version = "0.1.1"
edition = "2021"
license = "MIT"
description = "A recursive license tracer, obligations evaluator, and OSS compliance analyzer across dependency graphs"
authors = ["license-trace contributors"]
repository = "https://github.com/rikutoyamada01/license-trace"
homepage = "https://github.com/rikutoyamada01/license-trace"
documentation = "https://docs.rs/license-trace"
readme = "README.md"
keywords = ["license", "spdx", "compliance", "copyleft", "sbom"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.43", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
petgraph = "0.7"
spdx = "0.10"
owo-colors = "4.2"
comfy-table = "7.1"
anyhow = "1.0"
futures = "0.3"
async-recursion = "1.1"
semver = "1.0"
