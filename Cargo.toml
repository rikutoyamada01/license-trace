[package]
name = "license-trace"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A recursive license tracer and compatibility analyzer across dependency graphs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.43", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
petgraph = "0.7"
spdx = "0.10"
owo-colors = "4.2"
comfy-table = "7.1"
anyhow = "1.0"
thiserror = "2.0"
futures = "0.3"
async-recursion = "1.1"
semver = "1.0"

